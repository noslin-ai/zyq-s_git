[project]
name = "gov-policy-crawler"
version = "0.1.0"
description = "面向中国地级市政府官网的政策文件采集 MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
gov-policy-crawler = "gov_policy_crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gov_policy_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

